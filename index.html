<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0A4D46">
  <title>تم التحقق من البريد الإلكتروني | وينها</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#083934,#0F766E);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#12332f}
    main{width:min(100%,440px);background:#fff;border-radius:28px;padding:34px 26px;text-align:center;box-shadow:0 24px 70px #001b1840}
    .mark{margin:0 auto 18px;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:#e5f7f1;color:#087b63;font-size:42px;font-weight:800}
    h1{font-size:25px;margin:0 0 12px}p{line-height:1.9;color:#526762;margin:0 0 24px}
    a{display:block;text-decoration:none;border-radius:14px;background:#0a6558;color:#fff;padding:15px 18px;font-weight:700}
    .note{font-size:12px;margin-top:16px;margin-bottom:0;color:#74837f}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1 id="title">تم تأكيد بريدك الإلكتروني</h1>
    <p id="message">صار حسابك جاهزاً. اضغط على الزر للانتقال إلى تطبيق وينها وتسجيل الدخول.</p>
    <a href="waynha://auth/verified">الانتقال إلى تطبيق وينها</a>
    <p class="note">إذا ما فتح التطبيق، افتحه يدوياً وسجّل الدخول باستخدام بريدك وكلمة المرور.</p>
  </main>
  <script>
    const query = new URLSearchParams(location.search);
    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
    const hasVerificationResult = query.has("code") || hash.has("access_token") || hash.get("type") === "signup" || hash.get("type") === "email";
    const error = query.get("error_description") || hash.get("error_description");
    if (error) {
      document.getElementById("title").textContent = "تعذّر تأكيد البريد";
      document.getElementById("message").textContent = "الرابط غير صالح أو انتهت صلاحيته. ارجع إلى وينها واطلب رابط تحقق جديد.";
    } else if (!hasVerificationResult) {
      document.getElementById("title").textContent = "افتح تطبيق وينها";
      document.getElementById("message").textContent = "إذا ضغطت رابط التحقق بالفعل، افتح التطبيق وسجّل الدخول. وإذا لم يتم التحقق، افتح أحدث رسالة وصلتك.";
    }
  </script>
</body>
</html>
